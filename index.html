<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#536245" />
    
    <!-- Primary Meta Tags -->
    <!-- Per-page title, description, robots, canonical, og:title/description/url and twitter:title/description/url come from src/components/Seo.tsx -->
    <meta name="keywords" content="digital agency, marketing consultation, SEO, performance marketing, content creation, UI/UX design, influencer marketing, e-commerce solutions, IT solutions" />
    <meta name="author" content="Social Entities Agency" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://images.unsplash.com/photo-1557804506-669a67965ba0?q=80&w=1200&auto=format&fit=crop" />
    <meta property="og:site_name" content="Social Entities Agency" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1557804506-669a67965ba0?q=80&w=1200&auto=format&fit=crop" />

    <!-- Font Preloading -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Caveat:wght@600;700&family=Great+Vibes&family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=UnifrakturMaguntia&display=swap" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Caveat:wght@600;700&family=Great+Vibes&family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
    <!-- JSON-LD Schema Markup -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "Social Entities",
      "url": "https://socialentities.com/",
      "description": "Social Entities is a full-service digital agency blending strategy, creativity, and technology.",
      "sameAs": [
        "https://www.facebook.com/socialentities",
        "https://www.linkedin.com/company/social-entities/posts/?feedView=all",
        "https://www.instagram.com/socialentities/"
      ],
      "offers": {
        "@type": "AggregateOffer",
        "offerCount": "6",
        "itemOffered": [
          { "@type": "Service", "name": "Marketing Consultation" },
          { "@type": "Service", "name": "SEO" },
          { "@type": "Service", "name": "Performance Marketing" },
          { "@type": "Service", "name": "Content Creation" },
          { "@type": "Service", "name": "E-commerce Solutions" },
          { "@type": "Service", "name": "IT Solutions" }
        ]
      }
    }
    </script>
  </head>
  <body class="bg-white text-slate-900 antialiased selection:bg-stone-200">
    <div id="root"></div>
    <noscript>
      <div style="padding: 20px; text-align: center; font-family: sans-serif;">
        <p><strong>Social Entities - Digital Agency</strong></p>
        <p>Social Entities is a full-service digital agency blending strategy, creativity, and technology. We offer marketing consultation, SEO, performance marketing, design, e-commerce, and IT solutions to help brands grow.</p>
        <p>Please enable JavaScript to view and interact with our fully featured website.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
